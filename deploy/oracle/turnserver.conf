# coturn relay for voice calls. Clients get short-lived credentials from the
# game server's /api/ice, derived from the shared secret below.
listening-port=3478
fingerprint
use-auth-secret
static-auth-secret=@TURN_SECRET@
realm=@DOMAIN@
server-name=@DOMAIN@

# Oracle VMs sit behind NAT: tell coturn the public address and the local one.
external-ip=@PUBLIC_IP@/@PRIVATE_IP@
min-port=49152
max-port=49351

# A relay must never be a way into the VM's own network or the cloud metadata service.
no-multicast-peers
no-cli
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255

# Small group: keep any one user or an abuser from eating the free bandwidth.
user-quota=20
total-quota=200
no-tls
no-dtls
