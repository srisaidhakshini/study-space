# Local development database:  docker compose up -d db
# For production, use compose.production.yml (see README.md).
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: study
      POSTGRES_PASSWORD: study
      POSTGRES_DB: study_space
    ports:
      - "5432:5432"
    volumes:
      - study-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U study -d study_space"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  study-db:
