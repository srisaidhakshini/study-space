<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" width="900" height="340">
  <defs><style>
    .t{font-family:'Courier New',monospace;font-weight:700}
    .ring{stroke-dasharray:377;animation:r 8s linear infinite;transform:rotate(-90deg);transform-box:fill-box;transform-origin:center}
    @keyframes r{from{stroke-dashoffset:377}to{stroke-dashoffset:0}}
    .bob{animation:b 2s ease-in-out infinite}@keyframes b{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
    .blink{animation:k 1s steps(2) infinite}@keyframes k{50%{opacity:0}}
    .coin{animation:c 4s ease-in infinite;opacity:0}@keyframes c{0%{opacity:0;transform:translateY(10px)}20%{opacity:1}100%{opacity:0;transform:translateY(-36px)}}
  </style></defs>
  <rect width="900" height="340" rx="14" fill="#2a1f2d"/>
  <rect x="30" y="30" width="520" height="280" rx="10" fill="#c9965f"/>
  <rect x="60" y="205" width="460" height="70" rx="6" fill="#a8773f"/>
  <rect x="60" y="200" width="460" height="14" fill="#d8aa72"/>
  <g class="bob">
    <rect x="270" y="80" width="150" height="40" rx="6" fill="#f8f3e8" stroke="#2a1f2d" stroke-width="3"/>
    <text x="345" y="108" text-anchor="middle" class="t" font-size="24" fill="#2a1f2d">24:59 <tspan class="blink">●</tspan></text>
    <rect x="320" y="124" width="14" height="14" fill="#f8f3e8" transform="rotate(45 327 131)"/>
    <rect x="312" y="140" width="66" height="60" rx="8" fill="#c97b63"/>
    <rect x="320" y="118" width="50" height="40" rx="8" fill="#6b3f2a"/>
    <rect x="326" y="132" width="38" height="30" rx="6" fill="#f2c9a0"/>
  </g>
  <text x="290" y="250" class="t" font-size="16" fill="#2a1f2d">Subject: Maths</text>
  <g transform="translate(720,150)">
    <circle r="60" fill="none" stroke="#ffffff22" stroke-width="12"/>
    <circle r="60" fill="none" stroke="#ffe08a" stroke-width="12" stroke-linecap="round" class="ring"/>
    <text y="10" text-anchor="middle" class="t" font-size="30" fill="#f8f3e8">25 min</text>
  </g>
  <text x="720" y="250" text-anchor="middle" class="t" font-size="18" fill="#ffe08a">+1 coin / minute</text>
  <g class="coin"><circle cx="720" cy="290" r="9" fill="#ffd34d" stroke="#b8862b" stroke-width="3"/></g>
  <g class="coin" style="animation-delay:2s"><circle cx="750" cy="290" r="9" fill="#ffd34d" stroke="#b8862b" stroke-width="3"/></g>
  <text x="450" y="330" text-anchor="middle" class="t" font-size="12" fill="#ffffff88">Illustration of the focus timer above a seated avatar</text>
</svg>
